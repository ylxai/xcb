# ============================================================
# Run xcb miner (RandomY / Core Coin XCB) on Puzl RunMyJob
# Runner: my-runner-1208-chrx (gitlab.com, Ready)
# ============================================================
#
# CARA PAKAI:
#   1. Ganti tag di bawah dengan tag runner kamu (cek GitLab:
#      Settings > CI/CD > Runners > tag milik runner ini).
#   2. Push ke repo GitLab yang runner-nya terdaftar.
#   3. Pantau pod + logs via kubectl:
#      kubectl get pods -n glp-jobs-clrdjwrrneju72nx3uaz23xz05kz8xfuf7zhqcytxe01z
#
# CATATAN BILLING:
#   Puzl menagih per CPU-second TERPAKAI. Mining RandomY = 100% CPU terus
#   menerus, jadi setiap detik job jalan = ditagih penuh. Set timeout
#   sesuai budget. Ini bukan workload yang cocok untuk model spike billing.

variables:
  # Pool & wallet default (sama dengan ENV di Dockerfile)
  POOL: "sg.catchthatrabbit.com:8008"
  WALLET: "cb23d6d8557e776f5ff9ab6a7fb7f59a3d385245fa7a"
  WORKER: "puzl-gitlab"
  # RandomY: wajib FULL_MEM=0 di container (LARGE_PAGES crash tanpa hugepages)
  FULL_MEM: "0"
  LARGE_PAGES: "0"
  # Threads menentukan pemakaian CPU pod. Runner Puzl dropContainerResourceLimits=true
  # (pod tanpa limits/requests) -> CPU pod = threads miner. 8 thread ~ 8 core terpakai.
  # Sesuaikan budget: CPU ditagih per CPU-second.
  THREADS: "8"

# --- JOB 1: Test singkat (2 menit) - buktikan miner jalan ---
test-miner:
  image: ylxai/kube-xcb:latest
  tags:
    - run
  script:
    - 'echo "=== Miner test: jalan 120 detik ==="'
    - 'timeout 120 /miner/miner-saya || true'
    - 'echo "=== Test selesai - logs di atas adalah bukti mining jalan ==="'
  timeout: 5m
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - "*.log"

# --- JOB 2: Mining panjang (1 jam, 8 thread) ---
mine-full:
  image: ylxai/kube-xcb:latest
  tags:
    - run
  script:
    - 'echo "=== Mining 1 jam dimulai (THREADS=$THREADS pool=$POOL) ==="'
    - 'timeout 3600 /miner/miner-saya || true'
    - 'echo "=== Mining selesai (1 jam) ==="'
  timeout: 2h
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - "*.log"